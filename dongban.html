<html lang="ko">
<head>

  <style>
    :root { color-scheme: light; font-family: Pretendard, "Noto Sans KR", "Apple SD Gothic Neo", Arial, sans-serif; }

    .mark { width: 58px; height: 58px; margin: 0 auto 24px; display: grid; place-items: center; border-radius: 16px; background: #eaf1ff; color: #255fc3; }
    .mark svg { width: 29px; height: 29px; }
    h1 { margin: 0 0 10px; font-size: clamp(1.65rem, 5vw, 2rem); line-height: 1.25; letter-spacing: -.04em; }
    p { margin: 0 0 30px; font-size: 1rem; line-height: 1.7; color: #60708c; }
    .button { display: flex; align-items: center; justify-content: center; gap: 9px; width: 100%; min-height: 56px; padding: 0 24px; border-radius: 12px; background: #255fc3; color: #fff; font-size: 1.05rem; font-weight: 700; text-decoration: none; box-shadow: 0 8px 18px rgba(37, 95, 195, .24); transition: transform .18s ease, background .18s ease, box-shadow .18s ease; }
    .button:hover { background: #174da9; transform: translateY(-2px); box-shadow: 0 12px 24px rgba(37, 95, 195, .28); }
    .button:focus-visible { outline: 3px solid #9bbcf4; outline-offset: 4px; }
    .button svg { width: 19px; height: 19px; }
    .divider { display: flex; align-items: center; gap: 14px; margin: 28px 0 22px; color: #8996aa; font-size: .875rem; }
    .divider::before, .divider::after { content: ""; height: 1px; flex: 1; background: #e2e8f2; }
    .mobile-option { display: flex; align-items: center; gap: 20px; padding: 18px; text-align: left; border-radius: 14px; background: #f7f9fd; border: 1px solid #e7ecf4; }
    .qr { width: 112px; height: 112px; flex: 0 0 auto; display: block; padding: 7px; background: #fff; border-radius: 10px; }
    .mobile-copy strong { display: block; margin-bottom: 7px; font-size: 1rem; color: #273753; }
    .mobile-copy span { display: block; font-size: .9rem; line-height: 1.55; color: #6d7c94; }
    .note { margin-top: 20px; font-size: .875rem; color: #8996aa; }
    @media (max-width: 480px) { .card { padding: 38px 22px 30px; border-radius: 16px; } .mobile-option { flex-direction: column; text-align: center; } .qr { width: 132px; height: 132px; } }
    @media (prefers-reduced-motion: reduce) { .button { transition: none; } }
    #bulk-open { border: 0; cursor: pointer; font-family: inherit; }
    html:has(#bulk-dialog[open]) { overflow: hidden; }
    #bulk-dialog {
      width: min(96vw, 1600px); max-width: none;
      height: 92vh; height: 92dvh; max-height: none;
      padding: 0; border: 1px solid #e2e8f2; border-radius: 16px;
      background: #fff; color: #14213d; overflow: hidden;
      box-shadow: 0 18px 50px rgba(27, 55, 100, .24);
    }
    #bulk-dialog[open] { display: flex; flex-direction: column; }
    #bulk-dialog::backdrop { background: rgba(20, 33, 61, .60); }
    .bulk-header {
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      padding: 10px 16px; border-bottom: 1px solid #e2e8f2;
    }
    #bulk-title { margin: 0; font-size: 1.05rem; }
    .bulk-controls { display: flex; flex-wrap: wrap; align-items: center; justify-content: flex-end; gap: 8px 12px; }
    .bulk-login { color: #174da9; font-size: .875rem; line-height: 1.4; }
    .bulk-login:focus-visible { outline: 3px solid #255fc3; outline-offset: 3px; }
    #bulk-close {
      min-width: 56px; min-height: 44px; padding: 0 12px; font: inherit;
      border: 1px solid #d6e0ef; border-radius: 8px;
      background: #f3f6fb; color: #14213d; cursor: pointer;
    }
    #bulk-close:focus-visible { outline: 3px solid #255fc3; outline-offset: 2px; }
    #bulk-status { margin: 0; padding: 10px 16px; background: #f3f6fb; color: #273753; }
    #bulk-frame { flex: 1; min-height: 0; }
    #bulk-frame iframe { display: block; width: 100%; height: 100%; border: 0; }
    @media (max-width: 640px) {

      border: 1px solid #e2e8f2;
      border-radius: 16px;
    }

  <script>
(() => {
  'use strict';

  const config = Object.freeze({
    companyId: 'ebdc0d5260994120ba4caaa6b085aac4',
    templateId: 'a17c6dc225ba4ae88a29a7564e3f3800'
  });
  const origin = 'https://www.eformsign.com';
  const mode = 'EMBEDDING_BULKDOCUMENT';

  class EformSignBulkDocument {
    constructor(iframe, option, callbacks, signal) {
      this.iframe = iframe;
      this.option = option;
      this.callbacks = callbacks;
      window.addEventListener('message', event => this.receive(event), { signal });
    }

    open() {
      const url = new URL('/eform/form/bulk_create.html', origin);
      url.search = new URLSearchParams({
        form_id: this.option.templateId,
        openmode: mode,
        lang_code: 'ko'
      });
      this.iframe.src = url.href;
    }

    receive(event) {
      const frameWindow = this.iframe.contentWindow;
      if (!frameWindow || event.origin !== origin || event.source !== frameWindow) return;

      let data = event.data;
      if (typeof data === 'string') {
        try { data = JSON.parse(data); } catch { return; }
      }
      if (!data || typeof data !== 'object' || Array.isArray(data)) return;

      switch (data.fn) {
        case 'isEmbeddingBulkDocument':
          this.sendInit(frameWindow);
          this.callbacks.ready();
          break;
        case 'saveSuccess':
          this.callbacks.success(data);
          break;
        case 'errorMessage':
          this.callbacks.error(data.code);
          break;
        case 'setStorage':
          if (isToken(data.message?.access_token)) {
            this.option.accessToken = data.message.access_token;
            if (isToken(data.message.refresh_token)) {
              this.option.refreshToken = data.message.refresh_token;
            }
          }
          break;
      }
    }

    sendInit(frameWindow) {
      frameWindow.postMessage(JSON.stringify({
        type: 'document',
        fn: 'isEmbeddingBulkDocument',
        message: {
          mode,
          company_id: this.option.companyId,
          country_code: 'kr',
          _id: this.option.memberId,
          access_token: this.option.accessToken,
          refresh_token: this.option.refreshToken,
          outside_key: '',
          action_callback: false,
          hide_title: false,
          hide_data_select: false,
          hide_request_popup: false,
          data_entry: ''
        }
      }), origin);
    }
  }

  const trigger = document.querySelector('#bulk-open');
  const dialog = document.querySelector('#bulk-dialog');
  if (typeof dialog.showModal !== 'function') return;
  const closeButton = document.querySelector('#bulk-close');
  const status = document.querySelector('#bulk-status');
  const mount = document.querySelector('#bulk-frame');
  let session;

  function isToken(value) {
    return typeof value === 'string' && value.length > 0 && !/\s/.test(value);
  }

  function showStatus(message) {
    status.textContent = message;
    status.hidden = !message;
  }

  function closeModal() {
    if (session?.frame && !session.completed &&
        !window.confirm('창을 닫으면 입력 중인 내용이 사라질 수 있습니다. 닫으시겠습니까?')) return;
    session?.controller.abort();
    clearTimeout(session?.timeout);
    session = undefined;
    mount.replaceChildren();
    dialog.close();
    trigger.focus();
  }

  closeButton.addEventListener('click', closeModal);
  dialog.addEventListener('cancel', event => {
    event.preventDefault();
    closeModal();
  });

  trigger.addEventListener('click', async () => {
    if (dialog.open) return;
    dialog.showModal();
    const current = { controller: new AbortController() };
    session = current;
    showStatus('이폼사인 일괄작성 화면을 준비하고 있습니다.');

    const { signal } = current.controller;
    try {
      const file = document.querySelector('#local-aws-example').files[0];
      if (!file) {
        showStatus('캠페인 페이지에서 테스트 예제 HTML을 선택하고 다시 눌러 주세요.');
        return;
      }
      const source = await file.text();
      if (session !== current || signal.aborted) return;
      const block = [...source.matchAll(/\buser\s*:\s*\{([^{}]*)\}/g)].at(-1)?.[1] || '';
      const read = key => block.match(new RegExp("\\b" + key + "\\s*:\\s*'([^']+)'"))?.[1];
      const exampleOrigin = source.match(/_domain\s*=\s*'([^']+)'/)?.[1];
      const companyId = source.match(/company:\s*\{\s*id:\s*'([a-f0-9]{32})'/i)?.[1];
      const templateId = source.match(/template_id:\s*'([a-f0-9]{32})'/i)?.[1];
      if (exampleOrigin !== origin || companyId !== config.companyId || templateId !== config.templateId) {
        showStatus('캠페인의 이폼사인 주소와 회사·템플릿 ID가 일치하는 예제 HTML을 선택해 주세요.');
        return;
      }
      const tokens = { member_id: read('id'), access_token: read('access_token'), refresh_token: read('refresh_token') };
      const jwtPattern = /^[\w-]+\.[\w-]+\.[\w-]+$/;
      const refreshPattern = /^[a-f0-9]{8}(?:-[a-f0-9]{4}){3}-[a-f0-9]{12}$/i;
      if (!tokens.member_id || !jwtPattern.test(tokens.access_token || '') ||
          !refreshPattern.test(tokens.refresh_token || '')) {
        showStatus('이폼사인에서 발급받은 액세스 토큰과 리프레시 토큰이 있는 예제를 선택해 주세요.');
        return;
      }

      try {
        const encoded = tokens.access_token.split('.')[1].replaceAll('-', '+').replaceAll('_', '/');
        const { exp } = JSON.parse(atob(encoded));
        if (typeof exp === 'number' && Date.now() >= exp * 1000) {
          showStatus('예제의 액세스 토큰이 만료됐습니다. 새 토큰이 들어 있는 예제를 선택해 주세요.');
          return;
        }
      } catch {
        showStatus('예제의 액세스 토큰 형식을 확인해 주세요.');
        return;
      }

      const iframe = document.createElement('iframe');
      iframe.title = '이폼사인 일괄작성';
      current.frame = iframe;
      mount.append(iframe);
      new EformSignBulkDocument(iframe, {
        ...config,
        memberId: tokens.member_id,
        accessToken: tokens.access_token,
        refreshToken: isToken(tokens.refresh_token) ? tokens.refresh_token : ''
      }, {
        ready() {
          clearTimeout(current.timeout);
          if (!current.hasResult) showStatus('');
        },
        success(data) {
          clearTimeout(current.timeout);
          current.hasResult = true;
          if (String(data.code) !== '-1') {
            showStatus('전송을 완료하지 못했습니다. 작성 화면의 안내를 확인해 주세요.');
            return;
          }
          const succeeded = Array.isArray(data.success_results) ? data.success_results.length : null;
          const failed = Array.isArray(data.fail_results) ? data.fail_results.length : null;
          current.completed = failed === 0 && succeeded > 0;
          if (failed > 0) {
            const count = succeeded === null ? '' : `성공 ${succeeded}건, `;
            showStatus(`${count}실패 ${failed}건입니다. 다시 전송하기 전에 실패한 행을 확인해 주세요.`);
          } else {
            showStatus(succeeded > 0 ? `${succeeded}건의 전송 요청이 처리되었습니다.` : '전송 요청이 처리되었습니다.');
          }
        },
        error(code) {
          clearTimeout(current.timeout);
          current.hasResult = true;
          current.completed = false;
          showStatus(String(code) === '403'
            ? '이폼사인에서 접근을 거부했습니다 (403). 상단에서 이폼사인 계정을 전환한 뒤 다시 열 수 있습니다.'
            : '이폼사인에서 오류가 발생했습니다. 작성 화면의 안내를 확인해 주세요.');
        }
      }, signal).open();
    } catch {
      if (session === current) showStatus('작성 권한을 불러오지 못했습니다. 창을 닫고 다시 시도해 주세요.');
    } finally {
      clearTimeout(current.timeout);
      if (session === current && current.frame && !signal.aborted) {
        current.timeout = setTimeout(() => {
          showStatus('이폼사인 화면에서 초기화 요청을 받지 못했습니다. 화면에 오류가 표시되면 해당 요청의 상태를 확인해 주세요.');
        }, 20000);
      }
    }
  });
})();

</script>
</body>
</html>
