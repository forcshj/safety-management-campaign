  <style>
    :root { color-scheme: light; font-family: Pretendard, "Noto Sans KR", "Apple SD Gothic Neo", Arial, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: #f3f6fb; color: #14213d; }
    main { min-height: 100vh; display: grid; place-items: center; padding: 24px; }
    .card { width: min(100%, 520px); padding: 44px 36px 34px; text-align: center; background: #fff; border: 1px solid #e2e8f2; border-radius: 20px; box-shadow: 0 18px 50px rgba(27, 55, 100, .10); }
    .mark { width: 58px; height: 58px; margin: 0 auto 24px; display: grid; place-items: center; border-radius: 16px; background: #eaf1ff; color: #255fc3; }
    .mark svg { width: 29px; height: 29px; }
    h1 { margin: 0 0 10px; font-size: clamp(1.65rem, 5vw, 2rem); line-height: 1.25; letter-spacing: -.04em; }
    p { margin: 0 0 30px; font-size: 1rem; line-height: 1.7; color: #60708c; }
    .button { display: flex; align-items: center; justify-content: center; gap: 9px; width: 100%; min-height: 56px; padding: 0 24px; border-radius: 12px; background: #255fc3; color: #fff; font-size: 1.05rem; font-weight: 700; text-decoration: none; box-shadow: 0 8px 18px rgba(37, 95, 195, .24); transition: transform .18s ease, background .18s ease, box-shadow .18s ease; }
    .button:hover { background: #174da9; transform: translateY(-2px); box-shadow: 0 12px 24px rgba(37, 95, 195, .28); }
    .button:focus-visible { outline: 3px solid #9bbcf4; outline-offset: 4px; }
    .button svg { width: 19px; height: 19px; }
    .divider { display: flex; align-items: center; gap: 14px; margin: 28px 0 22px; color: #8996aa; font-size: .875rem; }
    .divider::before, .divider::after { content: ""; height: 1px; flex: 1; background: #e2e8f2; }
    .mobile-option { display: flex; align-items: center; gap: 20px; padding: 18px; text-align: left; border-radius: 14px; background: #f7f9fd; border: 1px solid #e7ecf4; }
    .qr { width: 112px; height: 112px; flex: 0 0 auto; display: block; padding: 7px; background: #fff; border-radius: 10px; }
    .mobile-copy strong { display: block; margin-bottom: 7px; font-size: 1rem; color: #273753; }
    .mobile-copy span { display: block; font-size: .9rem; line-height: 1.55; color: #6d7c94; }
    .note { margin-top: 20px; font-size: .875rem; color: #8996aa; }
    @media (max-width: 480px) { .card { padding: 38px 22px 30px; border-radius: 16px; } .mobile-option { flex-direction: column; text-align: center; } .qr { width: 132px; height: 132px; } }
    @media (prefers-reduced-motion: reduce) { .button { transition: none; } }
